<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defensive Vulnerability Intelligence</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --accent: #58a6ff;
            --danger: #f85149;
            --border: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; color: var(--accent); }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2ea043; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .cve-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }
        .cve-id { font-size: 1.2em; font-weight: bold; color: var(--danger); }
        .cvss { background: var(--border); padding: 4px 8px; border-radius: 4px; font-size: 0.9em; }
        h3 { margin-top: 0; font-size: 1.1em; }
        .section-title { color: var(--accent); font-size: 0.9em; text-transform: uppercase; margin-top: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        ul { padding-left: 20px; margin-top: 5px; font-size: 0.9em; }
        .metadata { font-size: 0.8em; color: #8b949e; margin-top: 20px; }
        .search-bar { width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-bg); color: white; }
    </style>
</head>
<body>

    <header>
        <h1>Vulnerability Intelligence</h1>
        <button onclick="triggerCrawl()">Run Intelligence Crawler</button>
    </header>

    <input type="text" id="searchInput" class="search-bar" placeholder="Filter by CVE or keyword..." onkeyup="filterCards()">

    <div class="grid" id="vulnGrid">
        </div>

    <script>
        async function fetchIntel() {
            try {
                const response = await fetch('/api/vulnerabilities');
                const data = await response.json();
                renderCards(data);
            } catch (err) {
                console.error("Failed to fetch data", err);
            }
        }

        async function triggerCrawl() {
            try {
                const response = await fetch('/api/crawl', { method: 'POST' });
                const data = await response.json();
                alert(data.status);
            } catch (err) {
                alert('Failed to trigger crawler');
            }
        }

        function renderCards(data) {
            const grid = document.getElementById('vulnGrid');
            grid.innerHTML = '';
            data.forEach(intel => {
                const summary = intel.vulnerability_summary;
                const card = document.createElement('div');
                card.className = 'card';
                
                let remediationHtml = intel.remediation_steps.map(s => `<li>${s}</li>`).join('');
                let inventoryHtml = intel.inventory_and_patching.map(i => `<li>${i.product}: ${i.affected_versions} → Patch: ${i.fix_version}</li>`).join('');

                card.innerHTML = `
                    <div class="cve-header">
                        <span class="cve-id">${summary.cve_id}</span>
                        <span class="cvss">CVSS: ${summary.cvss_score}</span>
                    </div>
                    <h3>${summary.title}</h3>
                    <p style="font-size: 0.9em;">${summary.overview}</p>
                    
                    <div class="section-title">Affected Assets & Patching</div>
                    <ul>${inventoryHtml}</ul>

                    <div class="section-title">Defensive Remediation</div>
                    <ul>${remediationHtml}</ul>

                    <div class="metadata">
                        Date: ${intel.metadata.date} | Source: <a href="${intel.metadata.reference}" target="_blank" style="color:#58a6ff">Original Advisory</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        }

        // Initial load
        fetchIntel();
    </script>
</body>
</html>
